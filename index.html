
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Epic Mundo Ahorcado</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #2c3e50; color: white; }
        #canvas-ahorcado { background: #87CEEB; margin: 20px; border: 2px solid white; }
        .letra-btn { margin: 5px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Epic Mundo Ahorcado</h1>
    <canvas id="canvas-ahorcado" width="300" height="300"></canvas>
    <div id="palabra" style="font-size: 30px; margin: 20px;"></div>
    <div id="teclado"></div>
    <p id="intentos">Intentos restantes: 10</p>
    <button onclick="location.reload()">Reiniciar Partida</button>

    <script>
        const palabras = ["PYTHON", "HONDURAS", "TECLADO"];
        let palabraSecreta = palabras[Math.floor(Math.random() * palabras.length)];
        let adivinadas = Array(palabraSecreta.length).fill("_");
        let intentos = 10;
        const canvas = document.getElementById("canvas-ahorcado");
        const ctx = canvas.getContext("2d");

        function dibujarArbol() {
            ctx.fillStyle = "#5D4037"; // Tronco
            ctx.fillRect(120, 150, 40, 150);
            ctx.fillStyle = "#2E7D32"; // Copa
            ctx.beginPath();
            ctx.arc(140, 100, 70, 0, Math.PI * 2);
            ctx.fill();
        }

        function actualizarPantalla() {
            document.getElementById("palabra").innerText = adivinadas.join(" ");
            document.getElementById("intentos").innerText = "Intentos restantes: " + intentos;
        }

        const letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
        const tecladoDiv = document.getElementById("teclado");
        for (let letra of letras) {
            let btn = document.createElement("button");
            btn.innerText = letra;
            btn.className = "letra-btn";
            btn.onclick = function() {
                if (palabraSecreta.includes(letra)) {
                    for (let i = 0; i < palabraSecreta.length; i++) {
                        if (palabraSecreta[i] === letra) adivinadas[i] = letra;
                    }
                } else {
                    intentos--;
                }
                actualizarPantalla();
                if (intentos === 0) alert("Perdiste! Era: " + palabraSecreta);
                if (!adivinadas.includes("_")) alert("¡Ganaste!");
            };
            tecladoDiv.appendChild(btn);
        }

        dibujarArbol();
        actualizarPantalla();
    </script>
</body>
</html>
